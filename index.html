
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie - Food Delivery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #fff8f1;
}

/* Navbar */
nav {
    background: #ff5122;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

nav ul {
    display: flex;
    list-style: none;
    gap: 25px;
}

nav ul li a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* Hero */
.hero {
    background: #ffdfcc;
    text-align: center;
    padding: 65px 20px;
}

.hero h1 {
    color: #ef451c;
    font-size: 38px;
    margin-bottom: 12px;
}

.hero p {
    font-size: 17px;
}

/* Menu */
.menu {
    padding: 40px 7%;
    text-align: center;
}

.menu h2 {
    color: #ef451c;
    font-size: 30px;
    margin-bottom: 30px;
}

.food-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 25px;
}

.food-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    transition: 0.3s;
}

.food-card:hover {
    transform: translateY(-7px);
}

.food-card img {
    width: 100%;
    height: 170px;
    object-fit: cover;
    display: block;
}

.food-card h3 {
    margin: 18px 5px 8px;
    color: #333;
}

.price {
    color: #ff5122;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 13px;
}

.food-card button {
    background: #ff5122;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 18px;
}

.food-card button:hover {
    background: #e53e12;
}

/* Cart */
.cart {
    padding: 30px 7%;
    text-align: center;
}

.cart h2 {
    color: #ef451c;
    margin-bottom: 15px;
}

#cart-items {
    margin: 15px 0;
    line-height: 2;
}

.total {
    color: #ff5122;
    font-size: 22px;
    font-weight: bold;
}

/* Responsive */
@media(max-width: 1100px) {
    .food-container {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media(max-width: 700px) {
    nav {
        flex-direction: column;
        gap: 15px;
    }

    nav ul {
        gap: 15px;
    }

    .hero h1 {
        font-size: 28px;
    }

    .food-container {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .food-card img {
        height: 140px;
    }
}

@media(max-width: 400px) {
    .food-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<nav>
    <div class="logo">🍔 Foodie</div>

    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#cart">Cart 🛒</a></li>
        <li><a href="#admin">Admin</a></li>
    </ul>
</nav>

<!-- Hero Section -->
<section class="hero" id="home">
    <h1>Delicious Food Delivered!</h1>
    <p>Order your favourite food online.</p>
</section>

<!-- Food Menu -->
<section class="menu" id="menu">

    <h2>Our Food Menu</h2>

    <div class="food-container">

        <!-- Chicken Burger -->
        <div class="food-card">
            <img src=""C:\Users\IT DC LAB\Downloads\Chicken-Biryani-Recipe.jpg""
                 alt="Chicken Burger">
            <h3>Chicken Burger</h3>
            <p class="price">₹150</p>
            <button onclick="addToCart('Chicken Burger',150)">
                Add to Cart
            </button>
        </div>

        <!-- Pizza -->
        <div class="food-card">
            <img src=""C:\Users\IT DC LAB\Downloads\pizza.jpg""
                 alt="Pizza">
            <h3>Pizza</h3>
            <p class="price">₹250</p>
            <button onclick="addToCart('Pizza',250)">
                Add to Cart
            </button>
        </div>

        <!-- French Fries -->
        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&q=85"
                 alt="French Fries">
            <h3>French Fries</h3>
            <p class="price">₹100</p>
            <button onclick="addToCart('French Fries',100)">
                Add to Cart
            </button>
        </div>

        <!-- Biriyani -->
        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1563379091339-03246963d96c?auto=format&fit=crop&w=600&q=85"
                 alt="Biriyani">
            <h3>Biriyani</h3>
            <p class="price">₹180</p>
            <button onclick="addToCart('Biriyani',180)">
                Add to Cart
            </button>
        </div>

        <!-- Sandwich -->
        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=600&q=85"
                 alt="Sandwich">
            <h3>Sandwich</h3>
            <p class="price">₹120</p>
            <button onclick="addToCart('Sandwich',120)">
                Add to Cart
            </button>
        </div>

        <!-- Salad -->
        <div class="food-card">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=600&q=85"
                 alt="Fresh Salad">
            <h3>Fresh Salad</h3>
            <p class="price">₹130</p>
            <button onclick="addToCart('Fresh Salad',130)">
                Add to Cart
            </button>
        </div>

    </div>
</section>

<!-- Cart Section -->
<section class="cart" id="cart">

    <h2>🛒 Your Shopping Cart</h2>

    <div id="cart-items">
        Your cart is empty.
    </div>

    <p class="total">
        Total: ₹<span id="total">0</span>
    </p>

</section>

<script>

let cart = [];
let total = 0;

function addToCart(name, price) {

    cart.push({
        name: name,
        price: price
    });

    total += price;

    displayCart();

    alert(name + " added to cart!");
}

function displayCart() {

    let cartItems = document.getElementById("cart-items");

    if (cart.length === 0) {
        cartItems.innerHTML = "Your cart is empty.";
    } else {

        cartItems.innerHTML = "";

        cart.forEach((item, index) => {

            cartItems.innerHTML += `
                <p>
                    ${index + 1}. ${item.name}
                    - ₹${item.price}
                    <button onclick="removeItem(${index})">
                        Remove
                    </button>
                </p>
            `;

        });
    }

    document.getElementById("total").innerText = total;
}

function removeItem(index) {

    total -= cart[index].price;

    cart.splice(index, 1);

    displayCart();
}

</script>

</body>
</html>
